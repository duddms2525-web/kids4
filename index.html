<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>어뮤징잉글리시 · 밍키</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#132418;overflow:hidden}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;width:100vw;height:100dvh;background:#132418;overflow:hidden}
.screen{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hot{position:absolute;border:0;background:transparent;padding:0;margin:0;border-radius:18px}
.hot:active{background:#ffffff22;outline:3px solid #fff6}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#fffaf0;color:#442d20;border:2px solid #e5c98d;border-radius:999px;padding:11px 17px;font:800 14px Arial,"Noto Sans KR",sans-serif;box-shadow:0 8px 30px #0006;opacity:0;transition:.2s;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:#101c1399;display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
#modal.show{display:flex}.card{width:min(500px,88vw);background:#fffaf0;border:4px solid #a86c3c;border-radius:25px;padding:22px;box-shadow:0 20px 60px #0008;color:#452b1e;text-align:center}.card h2{margin:0 0 10px;font-size:24px}.card p{font-size:14px;line-height:1.6;margin:0 0 12px}.eng{background:#fff0b8;border-radius:15px;padding:13px;font-size:18px;font-weight:900;margin-bottom:14px}.card button{border:0;border-radius:14px;background:#f7bd29;padding:12px 22px;font-weight:900}.close{float:right;background:#eee!important;padding:8px 12px!important}
</style></head>
<body>
<div id="app"></div><div id="toast"></div>
<div id="modal"><div class="card"><button class="close" onclick="closeModal()">✕</button><h2 id="mt"></h2><p id="mb"></p><div class="eng" id="me"></div><button onclick="closeModal()">좋아요! 🌰</button></div></div>
<script>
const screens={home:"home.jpg",adventure:"adventure.jpg",book:"english-book.jpg",friends:"friends.jpg",house:"house.jpg",bonus:"bonus.jpg"};
const app=document.getElementById("app"),toast=document.getElementById("toast");
function showToast(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove("show"),1300)}
function modal(t,b,e){mt.textContent=t;mb.textContent=b;me.textContent=e||"";document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function go(n){render(n)}
function hot(sc,x,y,w,h,label,fn){let b=document.createElement("button");b.className="hot";b.style.left=x+"%";b.style.top=y+"%";b.style.width=w+"%";b.style.height=h+"%";b.setAttribute("aria-label",label);b.onclick=fn;sc.appendChild(b)}
function common(sc,name){
 if(name!="home")hot(sc,1,1,8,8,"뒤로",()=>go("home"));
 const xs=[1,17,33,49,65,81],tg=["home","house","house","house","friends","book"],lb=["오늘의 모험","내 집","펫","아이템","친구","영어책"];
 xs.forEach((x,i)=>hot(sc,x,84,16,16,lb[i],()=>go(tg[i])));
}
function render(name){
 app.innerHTML="";let sc=document.createElement("div");sc.className="screen";
 let im=document.createElement("img");im.src=screens[name]||screens.home;im.alt="어뮤징잉글리시 밍키";sc.appendChild(im);common(sc,name);
 if(name=="home"){
  hot(sc,28,69,45,12,"모험 시작",()=>go("adventure"));
  hot(sc,1,48,26,30,"이번 주 활동",()=>modal("WEEK 1 · 숲 탐험","Brown Bear 숲에서 첫 번째 표현을 만나요!","Brown bear, brown bear, what do you see?"));
  hot(sc,29,47,18,19,"들어봐요",()=>modal("들어봐요 🎧","밍키의 말을 편하게 들어봐요.","Brown bear, brown bear, what do you see?"));
  hot(sc,47,47,19,19,"말해봐요",()=>modal("말해봐요 🎤","따라 말해봐요. 용기 내서 말한 것 자체가 성공이에요!","Brown bear, brown bear, what do you see?"));
  hot(sc,65,47,19,19,"게임해봐요",()=>go("bonus"));hot(sc,78,74,20,16,"오늘의 보상",()=>modal("오늘의 보상 🎁","오늘의 모험을 완료하면 도토리를 받을 수 있어요!","🌰 +2 Acorns"));
 }
 if(name=="adventure"){
  hot(sc,12,16,30,17,"W1",()=>modal("WEEK 1 · 숲 탐험","Brown Bear를 만나고 동물 친구들을 찾아요.","Brown bear, brown bear, what do you see?"));
  hot(sc,52,16,30,16,"W2",()=>modal("WEEK 2 · 색깔 마을","색깔을 놀면서 익혀요.","What color is it? It's red!"));
  hot(sc,62,38,30,17,"W3",()=>modal("WEEK 3 · 동물 친구들","마법 안경으로 동물과 색을 찾아봐요.","I see a red bird!"));
  hot(sc,79,22,20,14,"W4",()=>modal("WEEK 4 · 파티 섬","보물지도를 따라 동물 보물을 찾아요.","Here is the bear!"));
  hot(sc,33,75,42,14,"미션",()=>modal("이번 주 미션 🐻","숲을 탐험하고 특별한 선물을 받아요!","Brown bear, brown bear, what do you see?"));
 }
 if(name=="book"){
  [[17,"3월"],[29,"4월"],[41,"5월"],[53,"6월"],[65,"7월"],[77,"8월"]].forEach(a=>hot(sc,a[0],30,12,17,a[1],()=>showToast(a[0]==17?"3월 Brown Bear 📖":"아직 잠겨 있어요 🔒")));
  hot(sc,53,48,40,22,"표현",()=>modal("우리가 만난 표현들","지금까지 만난 표현을 다시 듣고 말해볼 수 있어요.","What do you see?"));
  hot(sc,88,45,12,17,"표현",()=>showToast("표현 모음 📖"));hot(sc,88,62,12,17,"스티커",()=>showToast("스티커 앨범 ⭐"));hot(sc,88,79,12,17,"성장 기록",()=>showToast("밍키 성장 기록 🌱"));
 }
 if(name=="friends"){
  [15,27,39,51,63,75].forEach((y,i)=>hot(sc,1,y,31,10,"친구",()=>go("house")));hot(sc,68,20,29,14,"친구 집",()=>go("house"));hot(sc,36,42,60,31,"친구 집 구경",()=>{showToast("구경하고 🌰 +2");go("house")});
 }
 if(name=="house"){
  ["내 집","밍키 꾸미기","펫","아이템","숲 꾸미기"].forEach((t,i)=>hot(sc,0,13+i*14,15,12,t,()=>showToast(t+" 메뉴예요 🏡")));
  [0,16,32,48,64,80].forEach(x=>hot(sc,x,84,16,14,"꾸미기",()=>showToast("꾸미기 아이템을 골라봐요 ✨")));
  hot(sc,76,13,23,14,"집 레벨",()=>showToast("집 레벨 🏡"));hot(sc,76,34,23,14,"가구",()=>showToast("보유 가구 🪑"));hot(sc,76,54,23,18,"테마",()=>showToast("숲 속의 집 🌳"));
 }
 if(name=="bonus"){
  [[3,28,31,27,"나비를 잡아요!","Find the butterfly!"],[35,28,31,27,"색깔을 모아요!","Red! Red!"],[68,28,29,27,"동물 친구들을 찾아요!","Where is the duck?"],[3,56,31,27,"풍선을 터뜨려요!","Tap the blue balloon!"],[35,56,31,27,"같은 그림을 찾아요!","Find the same!"],[68,56,29,27,"퍼즐을 완성해요!","Good job!"]].forEach(c=>hot(sc,c[0],c[1],c[2],c[3],c[4],()=>modal(c[4],"영어를 들으면서 재미있게 놀아봐요!",c[5])));
  hot(sc,34,86,36,10,"오늘의 보너스",()=>modal("오늘의 Bonus 🎮","보너스 게임을 하면 도토리를 받을 수 있어요!","🌰 Acorn"));
 }
 app.appendChild(sc)
}
render("home");
</script></body></html>
