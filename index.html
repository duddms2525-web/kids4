<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>어뮤징잉글리시 · 밍키</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#102417;overflow:hidden}
body{font-family:Arial,"Noto Sans KR",sans-serif}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.screen{position:relative;width:min(100vw,1222px);height:min(100vh,1287px);aspect-ratio:1222/1287;overflow:hidden}
.screen.book{width:min(100vw,1374px);height:auto;aspect-ratio:1374/1145}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hot{position:absolute;border:0;background:transparent;border-radius:24px;cursor:pointer;padding:0}
.hot:active{background:#ffffff28;outline:3px solid #ffffff88}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#fffdf8;color:#3d2a20;border:2px solid #ead1a2;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;box-shadow:0 8px 30px #0005;opacity:0;transition:.22s;z-index:100;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:#13201699;display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#modal.show{display:flex}
.card{width:min(560px,94vw);background:#fffaf0;border:5px solid #a96d3d;border-radius:28px;box-shadow:0 20px 70px #0007;padding:24px;color:#4a2c1d}
.card h2{margin:0 0 8px;font-size:26px}.card p{line-height:1.6}.card .eng{background:#fff1bf;border-radius:16px;padding:15px;font-size:20px;font-weight:900;text-align:center;margin:14px 0}
.card button{background:#f6bd28;border:0;border-radius:16px;padding:13px 22px;font-weight:900;box-shadow:0 4px #c88b12}
.card .close{float:right;background:#eee1cc;box-shadow:none;padding:8px 12px}
@media(max-aspect-ratio:1/1){
 .screen{width:100vw;height:auto}
 .screen.book{width:100vw;height:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"><div class="card"><button class="close" onclick="closeModal()">✕</button><h2 id="mt"></h2><p id="mb"></p><div class="eng" id="me"></div><button onclick="closeModal()">좋아요! 🌰</button></div></div>

<script>
const S={
home:{file:"home.png",w:1222,h:1287},
adventure:{file:"adventure.png",w:1222,h:1287},
book:{file:"english-book.png",w:1374,h:1145},
friends:{file:"friends.png",w:1222,h:1287},
house:{file:"house.png",w:1222,h:1287},
bonus:{file:"bonus.png",w:1222,h:1287}
};
const app=document.getElementById("app"),toast=document.getElementById("toast");
let current="home";
function toastMsg(t){toast.textContent=t;toast.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>toast.classList.remove("show"),1200)}
function modal(title,body,eng=""){
 document.getElementById("mt").textContent=title;
 document.getElementById("mb").textContent=body;
 document.getElementById("me").textContent=eng;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function zone(box, label, fn){
 const b=document.createElement("button"); b.className="hot"; b.setAttribute("aria-label",label);
 b.style.left=box[0]+"%";b.style.top=box[1]+"%";b.style.width=box[2]+"%";b.style.height=box[3]+"%";
 b.onclick=fn; return b;
}
function navZones(name,box){
 const z=[];
 // top-left back
 z.push(zone([1.5,2,6.5,7],"뒤로",()=>go("home")));
 if(name!=="book"){
   // bottom six navigation buttons
   const xs=[2,18.5,34,50,66,82];
   const targets=["home","house","house","house","friends","book"];
   xs.forEach((x,i)=>z.push(zone([x,84.5,15.5,14],["오늘의 모험","내 집","펫","아이템","친구","영어책"][i],()=>go(targets[i]))));
 }
 return z;
}
function go(name){current=name;render(name)}
function render(name){
 const s=S[name]||S.home; app.innerHTML="";
 const sc=document.createElement("div");sc.className="screen"+(name==="book"?" book":"");
 const im=document.createElement("img");im.src="images/"+s.file;im.alt="어뮤징잉글리시 화면";sc.appendChild(im);

 // universal navigation / controls
 navZones(name).forEach(b=>sc.appendChild(b));

 if(name==="home"){
   sc.appendChild(zone([29,72,43,11],"모험 시작",()=>go("adventure")));
   sc.appendChild(zone([1,52,25,27],"이번 주 탐험",()=>modal("WEEK 1 · 숲 탐험","Brown Bear 숲에서 첫 번째 표현을 만나봐요!","Brown bear, brown bear, what do you see?")));
   sc.appendChild(zone([77,29,20,30],"오늘의 메뉴",()=>go("bonus")));
   sc.appendChild(zone([30,48,18,17],"들어봐요",()=>modal("들어봐요 🎧","밍키의 말을 천천히 들어봐요.","Brown bear, brown bear, what do you see?")));
   sc.appendChild(zone([48,48,18,17],"말해봐요",()=>modal("말해봐요 🎤","부담 없이 따라 말해봐요. 말해본 것 자체가 성공이에요!","Brown bear, brown bear, what do you see?")));
   sc.appendChild(zone([66,48,18,17],"게임해봐요",()=>go("bonus")));
   sc.appendChild(zone([80,78,18,12],"오늘의 보상",()=>modal("오늘의 보상 🎁","오늘의 모험을 완료하면 도토리를 받을 수 있어요!","🌰 +2 Acorns")));
 }
 if(name==="adventure"){
   // week nodes
   sc.appendChild(zone([13,16,29,16],"Week 1 숲 탐험",()=>modal("WEEK 1 · 숲 탐험","Brown Bear를 만나고 동물 친구들을 찾아요.","Brown bear, brown bear, what do you see?")));
   sc.appendChild(zone([52,17,29,15],"Week 2 색깔 마을",()=>modal("WEEK 2 · 색깔 마을","색깔 풍선과 함께 색깔 표현을 놀면서 익혀요.","What color is it? It's red!")));
   sc.appendChild(zone([62,39,29,16],"Week 3 동물 친구들",()=>modal("WEEK 3 · 동물 친구들","셀로판지 안경을 쓰고 동물과 색을 찾아봐요.","I see a red bird!")));
   sc.appendChild(zone([80,23,19,13],"Week 4 파티 섬",()=>modal("WEEK 4 · 파티 섬","보물지도를 따라 동물 보물을 찾아요.","Here is the bear!")));
   sc.appendChild(zone([35,76,43,13],"이번 주 미션",()=>modal("이번 주 미션 🐻","숲을 탐험하고 특별한 선물을 받아요!","Brown bear, brown bear, what do you see?")));
 }
 if(name==="book"){
   // left vertical menu
   const ys=[14,28,41,54,67,80];
   const tg=["home","house","house","house","friends","book"];
   const labs=["오늘의 모험","내 집","펫","아이템","친구","영어책"];
   ys.forEach((y,i)=>sc.appendChild(zone([0,y,11,y===80?17:12],labs[i],()=>go(tg[i]))));
   // month tabs
   sc.appendChild(zone([17,30,12,16],"3월 Brown Bear",()=>toastMsg("3월 Brown Bear가 열려 있어요 🐻")));
   sc.appendChild(zone([29,30,12,16],"4월 Butterfly",()=>toastMsg("4월은 아직 잠겨 있어요 🔒")));
   sc.appendChild(zone([41,30,12,16],"5월 Caterpillar",()=>toastMsg("5월은 아직 잠겨 있어요 🔒")));
   sc.appendChild(zone([53,30,12,16],"6월 Ocean",()=>toastMsg("6월은 아직 잠겨 있어요 🔒")));
   sc.appendChild(zone([65,30,12,16],"7월 Farm",()=>toastMsg("7월은 아직 잠겨 있어요 🔒")));
   sc.appendChild(zone([77,30,12,16],"8월 My Body",()=>toastMsg("8월은 아직 잠겨 있어요 🔒")));
   // expressions and side buttons
   sc.appendChild(zone([54,48,41,22],"표현 모음",()=>modal("우리가 만난 표현들","지금까지 만난 표현을 다시 들어보고 말해볼 수 있어요.","What do you see?")));
   sc.appendChild(zone([88,45,12,17],"내 표현 모두 보기",()=>toastMsg("표현 모음을 열었어요 📖")));
   sc.appendChild(zone([88,62,12,17],"스티커 모으기",()=>toastMsg("스티커 앨범을 열었어요 ⭐")));
   sc.appendChild(zone([88,79,12,17],"성장 기록",()=>toastMsg("밍키의 성장 기록을 확인해요 🌱")));
 }
 if(name==="friends"){
   // friend rows
   [15,27,39,51,63,75].forEach((y,i)=>sc.appendChild(zone([1,y,31,9],"친구 "+(i+1),()=>go("house"))));
   sc.appendChild(zone([69,20,27,13],"친구 집",()=>go("house")));
   sc.appendChild(zone([37,42,58,31],"친구의 집 구경",()=>{toastMsg("친구의 집을 구경하고 🌰 +2");go("house")}));
   sc.appendChild(zone([0,0,15,12],"뒤로",()=>go("home")));
 }
 if(name==="house"){
   // left categories
   const ys=[13,27,41,55,69];
   ys.forEach((y,i)=>sc.appendChild(zone([0,y,14,12],["내 집","밍키 꾸미기","펫","아이템","숲 꾸미기"][i],()=>toastMsg(["내 집","밍키 꾸미기","펫","아이템","숲 꾸미기"][i]+" 메뉴예요 🏡"][i]||"")));
   // categories bottom
   [0,16,32,48,64,80].forEach((x,i)=>sc.appendChild(zone([x,85,15,12],"꾸미기 카테고리",()=>toastMsg("꾸미기 아이템을 골라봐요 ✨"))));
   sc.appendChild(zone([76,13,22,14],"집 레벨",()=>toastMsg("집 레벨을 확인했어요 🏡")));
   sc.appendChild(zone([76,34,22,14],"보유 가구",()=>toastMsg("보유 가구를 확인했어요 🪑")));
   sc.appendChild(zone([76,54,22,18],"테마 변경",()=>toastMsg("숲 속의 집 테마예요 🌳")));
   sc.appendChild(zone([43,45,22,22],"밍키",()=>toastMsg("밍키가 인사해요! 🐿️")));
 }
 if(name==="bonus"){
   // six game cards
   const cards=[
    [3,28,31,27,"나비 잡기","Find the butterfly!"],
    [35,28,31,27,"색깔을 모아요","Red! Red!"],
    [68,28,29,27,"동물 친구들을 찾아요","Where is the duck?"],
    [3,56,31,27,"풍선을 터뜨려요","Tap the blue balloon!"],
    [35,56,31,27,"같은 그림을 찾아요","Find the same!"],
    [68,56,29,27,"퍼즐을 완성해요","Good job!"]
   ];
   cards.forEach(c=>sc.appendChild(zone(c.slice(0,4),c[4],()=>modal(c[4],"영어를 들으면서 재미있게 놀아봐요!",c[5]))));
   sc.appendChild(zone([34,86,36,10],"오늘의 보너스",()=>modal("오늘의 Bonus 🎮","보너스 게임을 플레이하면 도토리를 받을 수 있어요!","🌰 Acorn")));
   sc.appendChild(zone([0,0,18,28],"뒤로",()=>go("home")));
 }
 app.appendChild(sc);
}
render("home");
</script>
</body>
</html>
